<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOME | SAKUSURA</title><meta name="description" content="講義づくりの進み具合と次の作業を確認する、SAKUSURAのホーム。">
  <link rel="icon" href="/sakusura.svg" type="image/svg+xml"><script src="/src/theme.js"></script>
  <link rel="stylesheet" href="/src/home.css"><link rel="stylesheet" href="/src/theme.css">
  <script src="/src/studio-status.js"></script><script type="module" src="/src/command-palette.js"></script><script type="module" src="/src/job-center.js"></script><script type="module" src="/src/home.js"></script>
</head>
<body class="home-page">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="home-header">
    <a class="home-brand" href="/home" aria-label="SAKUSURA HOME"><img class="brand-logo" src="/sakusura-logo.webp" width="95" height="48" alt="SAKUSURA サクッとスライド"></a>
    <nav class="app-nav" aria-label="メインメニュー">
      <a href="/home" aria-current="page" aria-label="HOME"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m2.5 9 7.5-6 7.5 6M4.5 8v9h4v-5h3v5h4V8"/></svg><span>HOME</span></a>
      <a href="/library" aria-label="ライブラリ"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg><span>ライブラリ</span></a>
      <a href="/editor" aria-label="編集"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m4 16 1-4 8-8 3 3-8 8z"/></svg><span>編集</span></a><a id="nav-play-link" href="/player" aria-label="再生" title="再生画面を開く"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 4.5v11l9-5.5z"/></svg><span>再生</span></a>
      <a href="/design" aria-label="デザイン"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 0 14c3 0 0-4 3-4h2c5 0 2-10-5-10Z"/><circle cx="7" cy="7" r=".7"/><circle cx="12" cy="6" r=".7"/></svg><span>デザイン</span></a>
    </nav><span class="header-spacer"></span>
    <div class="sync-area"><span id="sync-status" role="status">制作状況を読み込み中</span><button id="refresh" type="button" aria-label="制作状況を更新"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.5h-3.5"/></svg><span>更新</span></button></div>
    <a class="settings-link" href="/settings" aria-label="設定" title="設定（外観・配色など）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 1-1h4l1 3 3 1 3 3-1 3 1 3-3 3-3 1-1 3h-4l-1-3-3-1-3-3 1-3-1-3 3-3z"/><circle cx="12" cy="12" r="3"/></svg></a>
  </header>
  <main id="main">
    <h1 id="welcome-title" class="sr-only">ホーム</h1>
    <div id="home-error" role="alert" hidden></div>
    <div class="dashboard-grid">
      <section class="panel status-section" aria-labelledby="status-title">
        <div class="section-head"><div><h2 id="status-title">講義の状態</h2><p id="status-summary" class="section-description">講義を確認しています…</p></div><span id="lecture-total" class="count-label"></span></div>
        <div class="progress-track" aria-hidden="true"><span id="ready-bar"></span></div>
        <div class="status-groups" aria-hidden="true"><span>制作中 — 対応が必要</span><span>完了</span></div>
        <div id="status-filters" class="status-filters" role="group" aria-label="講義の状態で絞り込む"></div>
        <section id="status-details" class="status-details" aria-labelledby="status-list-title" hidden>
          <div class="status-list-head"><h3 id="status-list-title">講義一覧</h3><span id="status-visible-count" class="count-label"></span><button id="status-mark-all" class="mark-all" type="button" hidden>すべて完了にする</button><button id="status-close" type="button" aria-label="講義の一覧を閉じる">閉じる <span aria-hidden="true">×</span></button></div>
          <div id="status-list" aria-busy="true"></div><button id="show-more" type="button" hidden>さらに表示</button>
          <p class="status-note">ファイルから自動判定しています。複数の状態に該当する講義もあります。無音で作った講義などは「完了にする」で完成として扱えます（あとで編集すると自動判定に戻ります）。</p>
        </section>
      </section>
      <aside class="activity-sidebar" aria-label="作業状況と音声生成の利用枠">
        <section class="panel jobs-section" aria-labelledby="jobs-title"><div class="section-head"><h2 id="jobs-title">進行中の作業</h2><span id="jobs-count" class="count-label">確認中</span></div><div id="active-jobs" aria-busy="true"><p class="loading">作業状況を読み込んでいます…</p></div></section>
        <section class="panel usage-section" aria-labelledby="usage-title"><div class="section-head"><h2 id="usage-title">音声生成の利用枠</h2><span class="small-tag">TTS</span></div><div id="tts-usage" aria-busy="true"><p class="loading">利用回数を読み込んでいます…</p></div></section>
      </aside>
      <section class="recent-section" aria-labelledby="recent-heading">
        <div class="section-head"><h2 id="recent-heading">最近の講義</h2></div>
        <div id="recent-grid" class="recent-grid">
          <div class="panel recent-panel"><h3><span aria-hidden="true">◷</span> 最近編集した講義</h3><div id="recent-list"><p class="loading">読み込み中…</p></div></div>
          <div class="panel recent-panel"><h3><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 12v5h14v-5"/></svg> 最近取り込んだ講義</h3><div id="imported-list"><p class="loading">読み込み中…</p></div></div>
        </div>
      </section>
    </div>
  </main>
</body></html>
