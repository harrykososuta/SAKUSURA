<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>デザイン一覧 | SAKUSURA</title><link rel="icon" href="/sakusura.svg" type="image/svg+xml"><script src="/src/theme.js"></script><link rel="stylesheet" href="/src/design.css"><link rel="stylesheet" href="/src/design-gallery.css"><link rel="stylesheet" href="/src/theme.css"><script type="module" src="/src/design.js"></script></head>

  <main class="design-main">
    <div class="page-heading"><div><p class="overline">DESIGN LIBRARY</p><h1>デザイン一覧</h1><p class="page-description">デザインを選んで編集できます。新しいデザインはPDFから追加できます。</p></div><div class="design-page-actions"><span id="design-count" class="view-badge">1テーマ</span><a class="design-primary-link" id="add-design" href="/design/new">＋ デザインを追加</a></div></div>
    <p id="design-error" class="design-error" role="alert" hidden></p>
    <details class="gallery-category-settings"><summary>カテゴリごとのデザイン設定</summary><div id="gallery-category-settings"></div></details>
    <div class="design-library-workspace">
      <nav class="design-folders" aria-label="デザインの収納先"><strong>フォルダー</strong><button type="button" data-design-folder="active" aria-current="true"><span class="design-folder-icon"></span><span>デザイン</span><small>0</small></button><button type="button" data-design-folder="unused"><span class="design-folder-icon"></span><span>使わない</span><small>0</small></button><button type="button" data-design-folder="trash"><span class="design-folder-icon"></span><span>ゴミ箱</span><small>0</small></button><p id="design-folder-hint">サムネイルをフォルダーへドラッグして移動できます。「···」からも操作できます。</p></nav>
      <section class="design-library-main" aria-labelledby="design-folder-title"><div class="design-library-toolbar"><div><h2 id="design-folder-title">デザイン</h2><span id="design-result-count">0件</span></div><label class="design-search"><span>検索</span><input id="design-search" type="search" placeholder="デザイン名で検索" aria-label="デザイン名・説明で検索" autocomplete="off"></label><select id="design-sort" aria-label="デザインの並び順"><option value="updated">更新順</option><option value="name">名前順</option></select></div><p id="design-gallery-status" role="status" aria-live="polite"></p><div id="design-list"></div><p id="design-list-empty" class="design-list-empty" hidden></p></section>
    </div>
    <footer class="design-footer"><span>SAKUSURA <span aria-hidden="true">/</span> デザインライブラリ</span><span>追加したデザインは、このプロジェクトに保存されます。</span></footer>
  </main><dialog id="design-delete-dialog" aria-labelledby="design-delete-title"><h2 id="design-delete-title">デザインを削除</h2><p><strong id="design-delete-name"></strong>をゴミ箱へ移動します。後で復元できます。</p><p>カテゴリや講義で使用中の場合は削除できません。「使わない」への移動はできます。</p><p id="design-delete-error" role="alert" hidden></p><div><button id="design-delete-cancel" type="button">キャンセル</button><button id="design-delete-confirm" type="button">ゴミ箱へ移動</button></div></dialog><noscript>デザインの表示にはJavaScriptが必要です。</noscript>
