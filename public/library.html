<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><script src="/src/studio-status.js"></script><script type="module" src="/src/command-palette.js"></script><script type="module" src="/src/job-center.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><title>スライドライブラリ | SAKUSURA</title><link rel="icon" href="/sakusura.svg" type="image/svg+xml"><script src="/src/theme.js"></script><link rel="stylesheet" href="/src/library.css"><link rel="stylesheet" href="/src/share.css"><link rel="stylesheet" href="/src/theme.css"><script type="module" src="/src/library.js"></script></head>
<body>
  <header class="library-header"><a class="brand" href="/library" aria-label="SAKUSURA スライドライブラリ"><img class="brand-logo" src="/sakusura-logo.webp" width="95" height="48" alt="SAKUSURA サクッとスライド"></a><nav class="app-nav" aria-label="メインメニュー"><a href="/home" aria-label="HOME" title="HOME"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m2.5 9 7.5-6 7.5 6M4.5 8v9h4v-5h3v5h4V8"/></svg><span>HOME</span></a><a aria-current="page" title="いまの画面（ライブラリ）"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.2"/><rect x="11" y="3" width="6" height="6" rx="1.2"/><rect x="3" y="11" width="6" height="6" rx="1.2"/><rect x="11" y="11" width="6" height="6" rx="1.2"/></svg><span>ライブラリ</span></a><a id="return-link" href="/editor"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16.2 5 12l8-8 3.1 3.1-8 8z"/><path d="m11.2 5.8 3 3"/></svg><span>編集</span></a><a id="nav-play-link" href="/player" aria-label="再生" title="再生画面を開く"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 4.5v11l9-5.5z"/></svg><span>再生</span></a><a id="design-link" href="/design"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 0 14c1 0 1.5-.6 1.5-1.4 0-.9-.8-1.2-.8-2s.6-1.3 1.6-1.3H15a2.5 2.5 0 0 0 2.5-2.5C17.5 6 14.2 3 10 3z"/><circle cx="6.5" cy="9.2" r=".9"/><circle cx="9" cy="6.2" r=".9"/><circle cx="12.8" cy="6.6" r=".9"/></svg><span>デザイン</span></a></nav><span class="header-spacer"></span><a class="settings-link" href="/settings" title="設定（配色など）" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></a></header>
  <div class="library-layout">
    <main>
      <div id="library-error" role="alert" hidden></div><p id="library-status" role="status"></p>
      <section class="lecture-section" aria-label="スライド一覧">
        <nav id="category-tabs" class="category-tabs" aria-label="カテゴリ"></nav>
        <div class="list-toolbar"><div class="list-location"><nav id="breadcrumbs" aria-label="現在の場所"></nav><span class="folder-actions"><button id="rename-folder" class="icon-button" type="button" title="このフォルダーの名前を変更" aria-label="このフォルダーの名前を変更" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16.2 5 12l8-8 3.1 3.1-8 8z"/><path d="m11.2 5.8 3 3"/></svg></button><button id="delete-folder" class="icon-button danger-text" type="button" title="このフォルダーを削除（ごみ箱へ）" aria-label="このフォルダーを削除" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg></button></span><span id="result-count"></span></div><div class="search-tools"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="スライド名・演題番号で検索" aria-label="スライドを検索"></label><select id="sort" aria-label="並べ替え"><option value="updated">更新が新しい順</option><option value="title">スライド名順</option><option value="number">演題番号順</option></select><button id="refresh" title="一覧を更新" aria-label="一覧を更新">↻</button><span class="tools-divider" aria-hidden="true"></span><button id="share-import" class="share-import-button" type="button" title="ほかのSAKUSURAから届いた共有ファイル（ZIP）を取り込みます。ZIPを画面にドラッグしても取り込めます"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-3.5-3.5L10 12l3.5-3.5"/><path d="M3.5 12.5v3a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5v-3"/></svg>共有ファイルを取り込む</button><input id="share-file" type="file" accept=".zip,application/zip" hidden><button id="new-folder" class="primary"><span aria-hidden="true">＋</span> フォルダーを作成</button></div></div>
        <div id="selection-actions" hidden><strong id="selection-count"></strong><button id="move-selected">移動先を変更</button><button id="delete-selected" class="danger-text">選択した項目を削除</button><button id="restore-selected" hidden>選択した項目を復元</button><button id="clear-selection">選択を解除</button></div>
        <div class="table-scroll"><table><thead><tr><th class="check-cell"><input id="select-all" type="checkbox" aria-label="表示中の項目をすべて選択"></th><th>スライド名</th><th id="location-heading">保存場所</th><th id="content-heading" class="pages-column">枚数</th><th id="date-heading" class="date-column">更新日</th><th><span class="visually-hidden">操作</span></th></tr></thead><tbody id="lecture-list"></tbody></table></div>
        <nav id="pager" class="pager" aria-label="一覧のページ" hidden><span id="pager-range" class="pager-range"></span><div id="pager-pages" class="pager-pages"></div></nav>
        <div id="empty-state" hidden><span aria-hidden="true">▤</span><h3 id="empty-title">スライドが見つかりません</h3><p id="empty-description">検索条件を変えるか、別のカテゴリ・フォルダーを開いてください。</p></div>
      </section>
      <footer class="library-footer"><span id="total-count"></span><span>分類は自動保存されます。</span></footer>
    </main>
    <aside class="folder-panel"><div class="panel-title">フォルダー</div><nav id="folder-tree" aria-label="フォルダー"></nav><div class="sidebar-note">フォルダー名の左の矢印で開閉できます。Ctrl+クリックで複数のフォルダーを選択し、スライドやフォルダーはドラッグで整理できます。</div></aside>
  </div>
  <dialog id="folder-dialog"><form id="folder-form"><span class="dialog-eyebrow">FOLDER</span><h2 id="folder-dialog-title">フォルダーを作成</h2><label>フォルダー名<input id="folder-name" type="text" maxlength="60" required autocomplete="off" placeholder="例：血管解剖、基礎編、2026年度"></label><div id="folder-location-fields"><label>カテゴリ<select id="folder-category" required></select></label><label>作成先<select id="folder-parent"></select></label></div><p class="dialog-error" data-error role="alert" hidden></p><div class="dialog-actions"><button type="button" data-close="folder-dialog">キャンセル</button><button id="folder-submit" class="primary" type="submit">作成する</button></div></form></dialog>
  <dialog id="move-dialog"><form id="move-form"><span class="dialog-eyebrow">ORGANIZE</span><h2>スライドの移動先を変更</h2><p id="move-summary"></p><label>移動先<select id="move-target"></select></label><p class="dialog-help">同じカテゴリのフォルダーへ移動できます。スライドのカテゴリは編集画面から変更できます。</p><p class="dialog-error" data-error role="alert" hidden></p><div class="dialog-actions"><button type="button" data-close="move-dialog">キャンセル</button><button id="move-submit" class="primary" type="submit">移動する</button></div></form></dialog>
  <dialog id="delete-dialog"><h2>選択した項目をごみ箱へ移動</h2><p id="delete-summary"></p><ul id="delete-items"></ul><p class="dialog-help">音声・画像も保持され、ごみ箱から復元できます。</p><p class="dialog-error" data-error role="alert" hidden></p><div class="dialog-actions"><button type="button" data-close="delete-dialog">キャンセル</button><button id="delete-submit" class="primary">削除する</button></div></dialog>
</body></html>
